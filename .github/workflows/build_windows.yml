name: Build Windows App

# 触发条件：推送到 main 分支，或者手动触发
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 安装 Flutter（带缓存加速）
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. 获取依赖
      - name: Install Dependencies
        run: flutter pub get

      # 3. 构建 Windows Release 版本
      - name: Build Windows Release
        run: flutter build windows --release

      # 4. 使用 Inno Setup 打包安装程序
      - name: Build Installer with Inno Setup
        run: |
          # 创建输出目录
          New-Item -ItemType Directory -Force -Path build/installer
          # 使用 GitHub Actions runner 自带的 Inno Setup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/windows_setup.iss
        shell: pwsh

      # 5. 上传安装包
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: amber-list-installer
          path: build/installer/*.exe

      # 6. 上传原始构建产物（便于调试）
      - name: Upload Raw Build
        uses: actions/upload-artifact@v4
        with:
          name: amber-list-windows-raw
          path: build/windows/x64/runner/Release/
