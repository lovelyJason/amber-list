name: Build Windows App

# 触发条件：打标签时触发，或者手动触发
on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0, v1.0.3 等格式的标签
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 安装 Flutter（带缓存加速）
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. 从 pubspec.yaml 提取版本号
      - name: Extract Version
        id: version
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s*(\d+\.\d+\.\d+)') {
            $version = $matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "Extracted version: $version"
          } else {
            echo "VERSION=unknown" >> $env:GITHUB_OUTPUT
            echo "Failed to extract version"
          }
        shell: pwsh

      # 3. 获取依赖
      - name: Install Dependencies
        run: flutter pub get

      # 4. 构建 Windows Release 版本
      - name: Build Windows Release
        run: flutter build windows --release

      # 5. 使用 Inno Setup 打包安装程序
      - name: Build Installer with Inno Setup
        run: |
          # 创建输出目录
          New-Item -ItemType Directory -Force -Path build/installer
          # 使用 GitHub Actions runner 自带的 Inno Setup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/windows_setup.iss
        shell: pwsh

      # 6. 上传安装包（带版本号）
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: amber-list-installer-v${{ steps.version.outputs.VERSION }}
          path: build/installer/*.exe

      # 7. 上传原始构建产物（带版本号，便于调试）
      - name: Upload Raw Build
        uses: actions/upload-artifact@v4
        with:
          name: amber-list-windows-raw-v${{ steps.version.outputs.VERSION }}
          path: build/windows/x64/runner/Release/
